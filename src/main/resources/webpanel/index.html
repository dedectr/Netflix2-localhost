<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #141414;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            padding: 20px 40px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: #b3b3b3;
            font-size: 1rem;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            color: #fff;
        }

        .nav-tab.active {
            background: #e50914;
            color: #fff;
        }

        .main-content {
            padding: 100px 40px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Download Tab */
        .download-section {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .download-section h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .download-section > p {
            color: #b3b3b3;
            margin-bottom: 30px;
            font-size: 1.1rem;
            text-align: center;
        }

        .download-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .download-form input[type="url"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 4px;
            background: #333;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .download-form input[type="url"]:focus {
            border-color: #e50914;
        }

        .download-form input[type="url"]::placeholder {
            color: #666;
        }

        .options-panel {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .options-panel h3 {
            font-size: 0.9rem;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .option-group {
            margin-bottom: 15px;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-group label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }

        .option-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 8px 16px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #2a2a2a;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #666;
            color: #fff;
        }

        .option-btn.active {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #e50914;
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover {
            background: #f40612;
        }

        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-secondary:hover {
            background: #444;
        }

        /* Progress */
        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #e50914;
            width: 0%;
            animation: progress-animation 2s ease-in-out infinite;
        }

        @keyframes progress-animation {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .progress-text {
            margin-top: 10px;
            color: #b3b3b3;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Status Tab */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .status-card {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #333;
        }

        .status-card h3 {
            color: #b3b3b3;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .status-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .status-card .value.online {
            color: #46d369;
        }

        .status-card .value.offline {
            color: #e50914;
        }

        /* Videos Tab */
        .videos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .videos-header h2 {
            font-size: 1.5rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-thumbnail {
            width: 100%;
            height: 160px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .video-info {
            padding: 15px;
        }

        .video-info h4 {
            font-size: 0.95rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-info .meta {
            color: #b3b3b3;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .video-actions {
            display: flex;
            gap: 8px;
        }

        .video-actions .btn {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #b3b3b3;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 4px;
            color: #fff;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #46d369;
        }

        .toast.error {
            background: #e50914;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .main-content {
                padding: 140px 20px 20px;
            }

            .download-form {
                flex-direction: column;
            }

            .download-section h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">VideoDL</div>
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="download">Baixar</button>
            <button class="nav-tab" data-tab="status">Status</button>
            <button class="nav-tab" data-tab="videos">Vídeos</button>
        </nav>
    </header>

    <main class="main-content">
        <!-- Download Tab -->
        <section id="download" class="tab-content active">
            <div class="download-section">
                <h1>Baixar Vídeo</h1>
                <p>Cole a URL do YouTube abaixo para baixar</p>
                
                <form class="download-form" id="downloadForm">
                    <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." required>
                </form>

                <div class="options-panel">
                    <h3>Opções de Download</h3>
                    
                    <div class="option-group">
                        <label>Formato</label>
                        <div class="option-row" id="formatoOptions">
                            <button type="button" class="option-btn active" data-value="VIDEO">Vídeo</button>
                            <button type="button" class="option-btn" data-value="AUDIO">Áudio (MP3)</button>
                        </div>
                    </div>

                    <div class="option-group">
                        <label>Qualidade</label>
                        <div class="option-row" id="qualidadeOptions">
                            <button type="button" class="option-btn active" data-value="BEST">Melhor</button>
                            <button type="button" class="option-btn" data-value="P1080">1080p</button>
                            <button type="button" class="option-btn" data-value="P720">720p</button>
                            <button type="button" class="option-btn" data-value="P480">480p</button>
                            <button type="button" class="option-btn" data-value="P360">360p</button>
                        </div>
                    </div>

                    <div class="option-group">
                        <label>Tipo</label>
                        <div class="option-row" id="playlistOptions">
                            <button type="button" class="option-btn active" data-value="false">Vídeo único</button>
                            <button type="button" class="option-btn" data-value="true">Playlist</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="downloadBtn" form="downloadForm">Baixar</button>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <p class="progress-text">Baixando... aguarde</p>
                </div>
            </div>
        </section>

        <!-- Status Tab -->
        <section id="status" class="tab-content">
            <h2 style="margin-bottom: 20px;">Status do Servidor</h2>
            <div class="status-grid">
                <div class="status-card">
                    <h3>Status</h3>
                    <div class="value online" id="serverStatus">Online</div>
                </div>
                <div class="status-card">
                    <h3>Vídeos Baixados</h3>
                    <div class="value" id="totalVideos">0</div>
                </div>
                <div class="status-card">
                    <h3>Uptime</h3>
                    <div class="value" id="uptime">-</div>
                </div>
            </div>
        </section>

        <!-- Videos Tab -->
        <section id="videos" class="tab-content">
            <div class="videos-header">
                <h2>Vídeos Baixados</h2>
                <button class="btn btn-primary" onclick="loadVideos()">Atualizar</button>
            </div>
            <div class="video-grid" id="videoGrid">
                <div class="empty-state">
                    <div class="icon">📁</div>
                    <h3>Nenhum vídeo baixado</h3>
                    <p>Baixe seu primeiro vídeo na aba "Baixar"</p>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // Tab Navigation
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');

                if (tab.dataset.tab === 'videos') loadVideos();
                if (tab.dataset.tab === 'status') loadStatus();
            });
        });

        // Option Buttons
        let selectedFormato = 'VIDEO';
        let selectedQualidade = 'BEST';
        let selectedPlaylist = 'false';

        function setupOptionButtons(groupId, callback) {
            const group = document.getElementById(groupId);
            group.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    callback(btn.dataset.value);
                });
            });
        }

        setupOptionButtons('formatoOptions', (val) => selectedFormato = val);
        setupOptionButtons('qualidadeOptions', (val) => selectedQualidade = val);
        setupOptionButtons('playlistOptions', (val) => selectedPlaylist = val);

        // Download Form
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            const btn = document.getElementById('downloadBtn');
            const progress = document.getElementById('progressContainer');

            btn.disabled = true;
            progress.classList.add('show');

            try {
                const response = await fetch(`/url?formato=${selectedFormato}&qualidade=${selectedQualidade}&playlist=${selectedPlaylist}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: url
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Download iniciado com sucesso!', 'success');
                    document.getElementById('urlInput').value = '';
                } else {
                    showToast(data.erro || 'Erro ao baixar vídeo', 'error');
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor', 'error');
            } finally {
                btn.disabled = false;
                setTimeout(() => progress.classList.remove('show'), 3000);
            }
        });

        // Load Videos
        async function loadVideos() {
            const grid = document.getElementById('videoGrid');
            try {
                const response = await fetch('/api/downloads');
                const data = await response.json();

                document.getElementById('totalVideos').textContent = data.count;

                if (data.videos.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📁</div>
                            <h3>Nenhum vídeo baixado</h3>
                            <p>Baixe seu primeiro vídeo na aba "Baixar"</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = data.videos.map(video => `
                    <div class="video-card">
                        <div class="video-thumbnail">${getIcon(video.name)}</div>
                        <div class="video-info">
                            <h4 title="${video.name}">${video.name}</h4>
                            <p class="meta">${formatSize(video.size)} • ${formatDate(video.lastModified)}</p>
                            <div class="video-actions">
                                <button class="btn btn-secondary" onclick="playVideo('${video.name}')">Assistir</button>
                                <button class="btn btn-danger" onclick="deleteVideo('${video.name}')">Excluir</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                showToast('Erro ao carregar vídeos', 'error');
            }
        }

        // Load Status
        async function loadStatus() {
            try {
                const startTime = Date.now();
                const response = await fetch('/status');
                const data = await response.json();

                const statusEl = document.getElementById('serverStatus');
                if (data.status === 'online') {
                    statusEl.textContent = 'Online';
                    statusEl.className = 'value online';
                } else {
                    statusEl.textContent = 'Offline';
                    statusEl.className = 'value offline';
                }

                const uptime = Date.now() - startTime;
                document.getElementById('uptime').textContent = formatUptime(uptime);

                const downloads = await fetch('/api/downloads');
                const dlData = await downloads.json();
                document.getElementById('totalVideos').textContent = dlData.count;

            } catch (err) {
                document.getElementById('serverStatus').textContent = 'Offline';
                document.getElementById('serverStatus').className = 'value offline';
            }
        }

        // Play Video
        function playVideo(filename) {
            const url = '/api/stream/' + encodeURIComponent(filename);
            window.open(url, '_blank');
        }

        // Delete Video
        async function deleteVideo(filename) {
            if (!confirm(`Deseja excluir "${filename}"?`)) return;

            try {
                const response = await fetch('/api/downloads/' + encodeURIComponent(filename), {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('Vídeo excluído com sucesso!', 'success');
                    loadVideos();
                } else {
                    showToast('Erro ao excluir vídeo', 'error');
                }
            } catch (err) {
                showToast('Erro de conexão', 'error');
            }
        }

        // Utility Functions
        function getIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['mp3', 'm4a', 'ogg', 'wav', 'flac'].includes(ext)) return '🎵';
            return '🎬';
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleDateString('pt-BR');
        }

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Auto-refresh status every 30s
        setInterval(() => {
            if (document.getElementById('status').classList.contains('active')) {
                loadStatus();
            }
        }, 30000);
    </script>
</body>
</html>
